# Local lab broker — Mosquitto 2.0.22 Windows installer
# (https://mosquitto.org/files/binary/win64/mosquitto-2.0.22-install-windows-x64.exe).
# Run: mosquitto -c mosquitto.conf -v
# Public brokers (test.mosquitto.org) are a documented fallback only.
listener 1883
allow_anonymous true
persistence false
max_queued_messages 1000
# --- Unit-3 security note (lab-disabled; enable for any LAN beyond localhost) ---
#listener 8883
#cafile C:/mosquitto/certs/ca.crt
#certfile C:/mosquitto/certs/server.crt
#keyfile C:/mosquitto/certs/server.key
#require_certificate false
